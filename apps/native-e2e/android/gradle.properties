# React Native codegen plus the Solid/control Release variants exceed Gradle's
# former 512 MiB metaspace cap during repeated physical-device test builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false
android.builtInKotlin=false
android.newDsl=false
